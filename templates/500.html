<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>500 — Compare The Brew</title>
    <meta name="description" content="Server error — CompareTheBrew" />
    <meta name="author" content="The Boys" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍺</text></svg>"
    />
    <link rel="stylesheet" href="/static/css/main.css" />
    <link rel="stylesheet" href="/static/css/dark.css" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
  </head>

  <body>
    <a href="/" id="siteLogo">CompareTheBrew</a>

    <div id="error-page">
      <div class="error-emoji">😵</div>
      <div class="error-title">Something went wrong</div>
      <p class="error-message">
        An error occurred on our end. Try again in a moment.
      </p>
      <a href="/" class="error-home-link">Back to home</a>
    </div>

    <footer>
      {% include 'snippets/footer.html' %}
    </footer>

    <style>
      #error-page {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -55%);
        text-align: center;
      }

      .error-emoji {
        font-size: 96px;
        line-height: 1;
      }

      .error-title {
        font-size: 32px;
        font-weight: bold;
        color: var(--color-gold);
        margin-top: 8px;
      }

      .error-message {
        font-size: 18px;
        color: var(--color-light);
        margin-top: 12px;
        margin-bottom: 32px;
      }

      .error-home-link {
        display: inline-block;
        padding: 12px 28px;
        background-color: var(--color-maroon);
        color: var(--color-yellow);
        border-radius: 9px;
        font-size: 18px;
        font-weight: bold;
        transition: background-color 0.2s ease;
      }

      .error-home-link:hover {
        background-color: #5a252c;
      }
    </style>
  </body>
</html>
